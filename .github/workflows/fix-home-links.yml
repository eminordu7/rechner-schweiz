name: Remove custom domain references

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace custom domain everywhere
        run: |
          python3 - <<'PY'
          from pathlib import Path
          old = 'https://entscheidungsrechner.ch'
          new = 'https://eminordu7.github.io/rechner-schweiz'
          for p in Path('.').rglob('*'):
              if not p.is_file() or '.git' in p.parts or '.github' in p.parts:
                  continue
              try:
                  s = p.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              if old in s:
                  p.write_text(s.replace(old, new), encoding='utf-8')
          PY
      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Remove all custom domain references'
          git push
