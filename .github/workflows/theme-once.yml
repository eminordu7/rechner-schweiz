name: Apply RechnerSchweiz theme
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  theme:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply theme
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files = [p for p in Path('.').glob('*.html') if p.name != 'danke.html']
          theme = '''\n/* RechnerSchweiz – dezentes Pastell-Theme */\nbody { background:#f7f8fb !important; color:#263247 !important; }\nheader { background:#fffdfc !important; border-bottom:1px solid #e9e6e4 !important; }\n.logo span { color:#6f8fb3 !important; }\n.hero h1 { color:#273449 !important; }\n.hero p,.intro,.note,.unit,.result-small,.hint,.sources,.privacy-note { color:#6d7685 !important; }\n.card,.section,.result,.disclaimer { border-color:#e6e5e2 !important; box-shadow:0 6px 22px rgba(58,67,82,.045) !important; }\n.card:nth-of-type(3n+1), .section:nth-of-type(3n+1) { background:#fffdfb !important; }\n.card:nth-of-type(3n+2), .section:nth-of-type(3n+2) { background:#fbfdfd !important; }\n.card:nth-of-type(3n), .section:nth-of-type(3n) { background:#fdfbfe !important; }\ninput,select,textarea { background:#fff !important; border-color:#d9dce2 !important; }\ninput:focus,select:focus,textarea:focus { outline:2px solid #e6edf5 !important; border-color:#9bb1c9 !important; }\nbutton,.button { background:#7895b5 !important; box-shadow:0 4px 12px rgba(92,115,143,.14) !important; }\nbutton:hover,.button:hover { background:#6885a6 !important; }\n.highlight,.saving { background:#f2f7fb !important; border-color:#dbe6ef !important; }\n.result-card,.result-box,.cost { background:#fafbfc !important; border-color:#e3e6ea !important; }\n.soon { background:#f1f2f3 !important; }\n.disclaimer { background:#fbfaf8 !important; }\nfooter { color:#858c97 !important; }\nfooter a,.back { color:#6d7685 !important; }\n.pastel-ai { margin:22px 0 8px; padding:15px 17px; border:1px solid #e1e7ee; border-radius:12px; background:#f7fafc; color:#667080; font-size:12px; line-height:1.55; }\n.pastel-ai strong { color:#4f6074; }\n@media(max-width:700px){ .pastel-ai{font-size:11.5px} }\n'''
          notice='''<div class="pastel-ai"><strong>Transparenz:</strong> Die Rechner wurden mit Unterstützung von KI erstellt und weiterentwickelt. Berechnungsmodelle, Annahmen und Standardwerte werden laufend überprüft, können aber Fehler enthalten. Prüfe die für dich relevanten Angaben und Werte vor wichtigen finanziellen oder technischen Entscheidungen selbst.</div>'''
          for p in files:
              s=p.read_text()
              if 'RechnerSchweiz – dezentes Pastell-Theme' not in s:
                  s=s.replace('</style>', theme+'</style>', 1)
              if 'class="pastel-ai"' not in s:
                  marker='</div></div><div class="disclaimer">'
                  if marker in s:
                      s=s.replace(marker, '</div>'+notice+'</div><div class="disclaimer">', 1)
                  else:
                      marker='</main><footer>'
                      s=s.replace(marker, notice+marker, 1)
              p.write_text(s)
          PY
      - name: Commit and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html'
          git commit -m 'Refresh site with subtle pastel theme and AI transparency' || true
          git rm .github/workflows/theme-once.yml || true
          git commit -m 'Remove one-time theme workflow' || true
          git push