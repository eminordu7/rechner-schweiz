name: Fix homepage links

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace homepage links
        run: |
          python3 - <<'PY'
          from pathlib import Path
          target = 'https://eminordu7.github.io/rechner-schweiz/index.html'
          for p in Path('.').glob('*.html'):
              s = p.read_text(encoding='utf-8')
              s = s.replace('href="/rechner-schweiz/index.html"', f'href="{target}"')
              s = s.replace('href="index.html"', f'href="{target}"')
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html'
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Fix homepage links to GitHub Pages'
          git push
