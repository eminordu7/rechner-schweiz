name: Final domain migration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Switch URLs to custom domain
        run: |
          python3 - <<'PY'
          from pathlib import Path
          old = 'https://eminordu7.github.io/rechner-schweiz'
          new = 'https://entscheidungsrechner.ch'
          for p in list(Path('.').glob('*.html')) + [Path('sitemap.xml'), Path('robots.txt')]:
              if p.exists():
                  s = p.read_text(encoding='utf-8')
                  p.write_text(s.replace(old, new), encoding='utf-8')
          PY
      - name: Commit final domain URLs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html' sitemap.xml robots.txt
          if git diff --cached --quiet; then
            echo 'No URL changes needed.'
          else
            git commit -m 'Switch site URLs to custom domain'
            git push
          fi
      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/domain-migration.yml
          git commit -m 'Remove temporary domain migration workflow'
          git push
